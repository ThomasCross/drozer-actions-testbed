name: Publish Docker Image on Docker Hub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 3.1.0)'
        required: false

jobs:
  get-verson:
    runs-on: ubuntu-latest
    steps:
      - name: get version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(echo "${{ github.event.release.name }}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        
  build:
    name: publish docker image to docker hub
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Login to dockerhub
      uses: docker/login-action@v3
      with:
       username: ${{ vars.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push to dockerhub
      uses: docker/build-push-action@v5
      with:
       context: "{{defaultContext}}:docker"
       push: true
       tags: uvmaster/drozer-testbed:latest,uvmaster/drozer-testbed:${{ VERSION }}
