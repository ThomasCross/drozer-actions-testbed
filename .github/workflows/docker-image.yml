name: Release Drozer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 3.1.0)'
        required: true # Making it required for manual runs to avoid errors

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
    steps:
      - name: Determine version
        id: version_step
        run: |
          VERSION=""
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "Version determined: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  docker-hub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: get-version
    if: ${{ needs.get-version.outputs.version != '' }}
    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
       username: ${{ vars.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push to Docker Hub
      uses: docker/build-push-action@v5
      with:
        context: "{{defaultContext}}:docker"
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          uvmaster/drozer-testbed:latest
          uvmaster/drozer-testbed:${{ needs.get-version.outputs.version }}

  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: get-version
    if: ${{ needs.get-version.outputs.version != '' }}
    
    permissions:
      id-token: write
      
    environment: 
      name: pypi
      url: https://pypi.org/p/drozer-testbed
      
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          
      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine
        
      - name: Build package
        run: python -m build
        
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
